<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CarIntel - Gespeicherte Fahrzeuge</title>
  <style>
    body {
      width: 450px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
      color: #38bdf8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    #clear-all {
      background: none;
      border: 1px solid #ef4444;
      color: #ef4444;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
    }
    #clear-all:hover {
      background-color: rgba(239, 68, 68, 0.1);
    }
    
    #cars-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 16px;
      max-height: 500px;
      overflow-y: auto;
    }
    
    .car-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .car-title {
      font-weight: 600;
      font-size: 15px;
      color: #e2e8f0;
      word-break: break-word;
    }
    
    .car-details {
      font-size: 13px;
      color: #94a3b8;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }
    
    .car-details strong {
      color: #cbd5e1;
    }
    
    .badges {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 4px;
    }
    
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      line-height: 1.3;
    }
    
    .badge.warning {
      background-color: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    
    .badge.info {
      background-color: rgba(56, 189, 248, 0.15);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    
    .badge.success {
      background-color: rgba(34, 197, 94, 0.15);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    
    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    
    .btn {
      flex: 1;
      text-align: center;
      padding: 6px;
      border-radius: 4px;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    
    .btn-primary {
      background-color: #38bdf8;
      color: #0f172a;
    }
    
    .btn-primary:hover {
      background-color: #0ea5e9;
    }
    
    .btn-danger {
      background-color: transparent;
      color: #ef4444;
      border: 1px solid #ef4444;
    }
    
    .btn-danger:hover {
      background-color: rgba(239, 68, 68, 0.1);
    }
    
    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: #94a3b8;
    }
    
    .empty-state p {
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <h2>
    Vergleichsliste
    <div style="display:flex; gap:8px;">
      <button id="open-compare" class="btn btn-primary" style="font-size:12px; padding:4px 8px;">📊 Vollbild-Vergleich öffnen</button>
      <button id="clear-all">Alle leeren</button>
    </div>
  </h2>
  
  <div id="cars-container">
    <!-- Populated by JS -->
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
